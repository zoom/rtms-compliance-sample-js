databases:
  - name: compliance-db
    plan: basic-256mb
    databaseName: compliance
    user: compliance

services:
  - type: web
    name: compliance-advisor
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compliance-db
          property: connectionString
      - key: PORT
        value: '3000'
      - key: NODE_ENV
        value: production
      # Zoom credentials, entered in the Render dashboard at blueprint creation.
      - key: ZM_RTMS_CLIENT
        sync: false
      - key: ZM_RTMS_SECRET
        sync: false
      - key: ZM_RTMS_WEBHOOK_SECRET
        sync: false
      # The service's public URL, e.g. https://compliance-advisor.onrender.com
      - key: PUBLIC_URL
        sync: false
      # Which rule pack is in force is a compliance decision, so there is no
      # default. One of: fin-us-retail-v4, health-us-intake-v1
      - key: RULE_PACK_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
