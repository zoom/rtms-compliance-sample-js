# EXAMPLE RULE PACK — ILLUSTRATIVE ONLY, NOT LEGAL ADVICE.
#
# This pack demonstrates the format. It is not a compliance product and makes
# no claim of FINRA, SEC, or state coverage. Before using anything like it with
# real clients, have your compliance and legal teams author and approve the
# content.
#
# Packs are versioned artifacts. Never edit one in place: copy it, bump the
# version suffix, and let the old version stay readable so a past meeting can
# be replayed against the rules that were in force at the time.

id: fin-us-retail-v4
jurisdiction: US
applies_to: [retail-investment-review]

prohibited:
  - id: guaranteed-return
    severity: high
    match:
      - 'guaranteed returns?'
      - 'guarantee\w*\b.{0,40}\b(returns?|gains?|profits?|yields?)'
      - 'risk[- ]free'
      - '\b(no|zero) risk\b'
      - 'can.t lose'
      - 'no way to lose'
    guidance: 'Past performance does not guarantee future results. Restate as a historical range.'

  - id: unapproved-projection
    severity: medium
    match:
      - 'you.ll definitely'
      - 'we always beat'
      - 'locked[- ]in gains?'
      - 'will double your'
    guidance: 'Replace the projection with approved illustration language.'

  - id: pressure-tactic
    severity: medium
    match:
      - 'only good until today'
      - 'you have to decide (right )?now'
      - 'this offer expires'
    guidance: "Remove urgency framing. Restate the actual deadline, if any, and the client's right to consider."

  - id: unlicensed-tax-advice
    severity: high
    match:
      - 'this is tax[- ]free'
      - 'you won.t owe (any )?tax'
      - 'write (it|this) off'
    guidance: 'Refer tax questions to a qualified tax advisor. Do not characterize tax treatment.'

  - id: sensitive-data-request
    severity: high
    match:
      - 'social security( number)?'
      - '\bssn\b'
      - '(account|online banking|login) password'
      - '\bpin (number|code)\b'
      - 'full (card|account) number'
    guidance: 'Never collect SSNs, passwords, or full account numbers verbally. Direct the client to the secure intake portal.'

  - id: undisclosed-third-party
    severity: low
    match:
      - 'off the record'
      - 'between you and me'
    guidance: 'All statements in a client meeting are on the record. Restate for the transcript.'

required_disclosures:
  # Patterns are case-insensitive. Speech is phrased many ways, so each
  # disclosure lists the common shapes rather than one canonical sentence.
  # "." stands in for an apostrophe, which transcripts render as ' or ’.
  - id: recording-consent
    severity: high
    satisfied_by:
      - 'is being recorded'
      - '\b(ok|okay|alright|all right|fine|consent|permission|mind)\b.{0,40}\brecord'
      - '\brecord(ing|ed)?\b.{0,40}\b(ok|okay|alright|all right|fine|consent|permission)\b'
      - '\b(we|i)(.re|.m| are| am| will be| will)( going to| gonna)?( be)? record(ing)?\b'
    prompt: 'Confirm verbal consent to record before continuing.'

  - id: fees-and-conflicts
    severity: high
    satisfied_by:
      - 'advisory fees?'
      - '\bfees?\b.{0,30}\b(schedule|structure|percent|basis points|annually|per year|a year)\b'
      - 'conflicts? of interest'
      - '\b(we|i)(.re|.m| are| am| get)? (compensated|paid)\b'
      - '\bcommissions?\b'
    prompt: 'State the advisory fee schedule and any conflicts of interest.'

  - id: risk-disclosure
    severity: high
    satisfied_by:
      - 'you (could|can|might|may) lose'
      - 'past performance'
      - 'not fdic insured'
      - 'investments? (involve|involves|carry|carries|have|has) (some )?risk'
      - '\b(no|not a) guarantee'
      - 'not guaranteed'
    prompt: 'State that investments carry risk and past performance is not indicative of future results.'

  - id: suitability-check
    severity: medium
    satisfied_by:
      - 'time horizon'
      - 'risk tolerance'
      - 'investment (objective|goal)s?'
      - '(financial|investment|retirement) goals?'
      - 'comfortable.{0,30}\brisk'
      - 'when (do|will) you need (the|this|that) money'
    prompt: "Confirm the client's time horizon, risk tolerance, and objectives on the record."
